name: CI and Release
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish npm and GitHub Release (version tag only)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-tag.mjs
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y subversion
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'svn.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'svn-tools'
          Invoke-WebRequest 'https://www.visualsvn.com/files/Apache-Subversion-1.14.5-5.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'E7372F041909D262A6BD5C11884C7B2138C5CCE5A583B7B5A0B8DE96C7C6E0AE') { throw 'SVN archive checksum mismatch' }
          Expand-Archive $archive $tools
          ./scripts/ci-svn-utf8.ps1 -Bin (Join-Path $tools 'bin')
          Join-Path $tools 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: git --version
      - run: svn --version --quiet
      - run: svnadmin --version --quiet
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run check
      - run: npm run verify:package
      - run: npm run test:install
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-node-${{ matrix.node }}
          path: release/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: node scripts/verify-tag.mjs
      - uses: actions/download-artifact@v4
        with:
          name: package-ubuntu-latest-node-24
          path: release/
      - run: sha256sum --check SHA256SUMS.txt
        working-directory: release
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run test:install
      - name: Preserve exact release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}-${{ github.run_id }}
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish npm first
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm run release:npm
      - name: Verify npm artifact bytes
        run: node scripts/verify-published.mjs
      - name: Publish GitHub Release using identical artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:github
